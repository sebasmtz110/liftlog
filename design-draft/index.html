<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiftLog design draft</title>
  <link rel="stylesheet" href="fonts/geist.css?v=20">
  <link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
  <div class="desk">
    <aside class="index">
      <h1>LiftLog draft</h1>
      <p>Sample week of 19 October 2026. Nothing here is your account.</p>
      <nav aria-label="Screens">
        <button type="button" data-jump="home">Today</button>
        <button type="button" data-jump="workouts">Workouts</button>
        <button type="button" data-jump="library">Library</button>
        <button type="button" data-jump="progress">Progress</button>
        <button type="button" data-jump="active" data-sample="mid">Active workout, mid-set</button>
        <button type="button" data-jump="complete">Completed session</button>
      </nav>
      <p class="note">Open an exercise from Today or Library for the detail screen. Pounds. Pull-ups stay out of loaded volume.</p>
    </aside>
    <div class="stage">
      <div class="phone" id="phone" data-mode="browse">
        <div class="island" aria-hidden="true"></div>
        <div class="status">
          <span>9:45</span>
          <span aria-hidden="true">
            <svg width="46" height="14" viewBox="0 0 46 14"><rect x="0" y="6" width="3" height="6" rx="0.5" fill="currentColor"/><rect x="5" y="4" width="3" height="8" rx="0.5" fill="currentColor"/><rect x="10" y="2" width="3" height="10" rx="0.5" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="currentColor"/><rect x="26" y="3" width="16" height="8" rx="2" fill="none" stroke="currentColor"/><rect x="28" y="5" width="10" height="4" rx="0.5" fill="currentColor"/></svg>
          </span>
        </div>
        <main class="scroll" id="scroll"></main>
        <nav class="tabbar" id="tabs" aria-label="Sections">
          <button type="button" data-tab="home" aria-current="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M4 10h16"/></svg>
            Today
          </button>
          <button type="button" data-tab="workouts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
            Workouts
          </button>
          <button type="button" data-tab="library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
            Library
          </button>
          <button type="button" data-tab="progress">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 16l4-5 4 3 6-7"/><path d="M4 19h16"/></svg>
            Progress
          </button>
        </nav>
      </div>
    </div>
  </div>
  <script src="data.js?v=20"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
